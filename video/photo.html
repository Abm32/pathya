<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The report as it arrives</title>
<style>
  :root { --accent: #2ee6c8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #06080a; }
  body { display: grid; place-items: center; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
  .frame { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  /* Slow push in: a still photograph should still be moving when it is on screen for nine seconds. */
  img {
    position: absolute; inset: 0; margin: auto; max-width: 100%; max-height: 100%;
    object-fit: contain; transform: scale(1.02); animation: push 11s cubic-bezier(.33,0,.2,1) forwards;
  }
  @keyframes push { to { transform: scale(1.13) translateY(-1.5%); } }
  .vig { position: absolute; inset: 0; box-shadow: inset 0 0 300px 90px rgba(6,8,10,.92); pointer-events: none; }
  .tag {
    position: absolute; left: 76px; bottom: 72px; display: flex; align-items: center; gap: 16px;
    font-size: 25px; letter-spacing: .02em; color: #e9eef0;
    background: rgba(6,8,10,.72); border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(14px);
    padding: 16px 26px; border-radius: 999px;
    opacity: 0; animation: in .8s cubic-bezier(.16,1,.3,1) .7s forwards;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 14px var(--accent); }
  @keyframes in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <div class="frame">
    <img src="../fixtures/lab-report-photo.jpg" alt="A pharmacogenomic lab report photographed on a phone">
    <div class="vig"></div>
    <div class="tag"><span class="dot"></span>Received on WhatsApp · the only copy that exists</div>
  </div>
</body>
</html>
